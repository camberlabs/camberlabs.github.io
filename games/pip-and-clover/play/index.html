<meta charset="utf-8" />

<title>Pip & Clover — Web Demo</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 38%, #2e1914 0%, #180c0a 72%, #0f0706 100%);
    color: #e8d8b7;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 8px;
  }
  canvas#game {
    width: 960px;
    height: 540px;
    max-width: calc(100vw - 24px);
    max-height: calc(100vh - 68px);
    aspect-ratio: 16 / 9;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 4px solid #5a3122;
    outline: 2px solid #291614;
    border-radius: 4px;
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.78), inset 0 0 0 1px #8b4f32;
    cursor: pointer;
    background: #163022;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-size: 12px;
    color: #c7bea2;
    text-align: center;
    max-width: 960px;
    line-height: 1.4;
  }
  .bar kbd {
    background: #3d1e15;
    border: 1px solid #8b4f32;
    color: #fef08a;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
    font-family: inherit;
  }
  .bar a {
    color: #fef08a;
    text-decoration: underline;
  }
  .seed-input-bar {
    display: none;
    align-items: center;
    gap: 6px;
    background: #3d1e15;
    border: 2px solid #8b4f32;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .seed-input-bar.visible { display: inline-flex; }
  .seed-input-bar input {
    background: #163022;
    border: 1px solid #357a52;
    color: #fef08a;
    font-family: inherit;
    font-size: 12px;
    padding: 2px 6px;
    width: 110px;
    text-transform: uppercase;
  }
  .seed-input-bar button {
    background: #8b4f32;
    color: #fffdf5;
    border: 1px solid #eab308;
    font-family: inherit;
    font-size: 11px;
    padding: 2px 7px;
    cursor: pointer;
  }
</style>
</head>

  const NIGHT_TARGETS = [120, 240, 420, 700, 1100, 1750, 2700, 4200, 6500, 10000, 15500, 24000];
  function getNightTarget(nightNum) {
    if (nightNum <= NIGHT_TARGETS.length) return NIGHT_TARGETS[nightNum - 1];
    let t = NIGHT_TARGETS[NIGHT_TARGETS.length - 1];
    for (let i = NIGHT_TARGETS.length; i < nightNum; i++) {
      t = Math.round((t * 1.55) / 50) * 50;
    }
    return t;
  }

  // Deterministic PRNG
  function hashSeedStr(str) {
    let h = 2166136261 >>> 0;
    const s = String(str || 'CLOVER7').toUpperCase();
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h || 1337;
  }
  function makeRng(seedInt) {
    let s = (seedInt >>> 0) || 1337;
    return function () {
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  // CORE DICE HAND EVALUATION & CHARM ENGINE
  // ==========================================================================
  function evaluateHand(dice) {
    const counts = [0, 0, 0, 0, 0, 0, 0];
    for (let i = 0; i < dice.length; i++) counts[dice[i]]++;

    const entries = [];
    for (let v = 6; v >= 1; v--) {
      if (counts[v] > 0) entries.push({ v, c: counts[v] });
    }
    entries.sort((a, b) => b.c - a.c || b.v - a.v);

    const uniqueSorted = [];
    for (let v = 1; v <= 6; v++) if (counts[v] > 0) uniqueSorted.push(v);

    // Check straight runs
    let bestRun = [];
    let curRun = [];
    for (let i = 0; i < uniqueSorted.length; i++) {
      if (i === 0 || uniqueSorted[i] === uniqueSorted[i - 1] + 1) {
        curRun.push(uniqueSorted[i]);
      } else {
        if (curRun.length > bestRun.length) bestRun = curRun;
        curRun = [uniqueSorted[i]];
      }
    }
    if (curRun.length > bestRun.length) bestRun = curRun;

    const top = entries[0];
    const second = entries[1] || { v: 0, c: 0 };

    let rankId = 'high_pip';
    let scoringIndices = [];

    if (top.c === 5) {
      rankId = 'five_clovers';
      scoringIndices = [0, 1, 2, 3, 4];
    } else if (top.c === 4) {
      rankId = 'four_kind';
      dice.forEach((d, i) => { if (d === top.v) scoringIndices.push(i); });
    } else if (bestRun.length === 5) {
      rankId = 'large_straight';
      scoringIndices = [0, 1, 2, 3, 4];
    } else if (top.c === 3 && second.c === 2) {
      rankId = 'full_house';
      scoringIndices = [0, 1, 2, 3, 4];
    } else if (bestRun.length >= 4) {
      rankId = 'small_straight';
      const used = new Set();
      const seq = bestRun.slice(-4);
      dice.forEach((d, i) => {
        if (seq.includes(d) && !used.has(d)) {
          used.add(d);
          scoringIndices.push(i);
        }
      });
    } else if (top.c === 3) {
      rankId = 'three_kind';
      dice.forEach((d, i) => { if (d === top.v) scoringIndices.push(i); });
    } else if (top.c === 2 && second.c === 2) {
      rankId = 'two_pair';
      dice.forEach((d, i) => { if (d === top.v || d === second.v) scoringIndices.push(i); });
    } else if (top.c === 2) {
      rankId = 'pair';
      dice.forEach((d, i) => { if (d === top.v) scoringIndices.push(i); });
    } else {
      rankId = 'high_pip';
      let maxIdx = 0;
      for (let i = 1; i < dice.length; i++) {
        if (dice[i] > dice[maxIdx]) maxIdx = i;
      }
      scoringIndices = [maxIdx];
    }

    const rank = HAND_RANKS.find((h) => h.id === rankId);
    let pipSum = 0;
    for (let i = 0; i < scoringIndices.length; i++) pipSum += dice[scoringIndices[i]];
    return {
      rank,
      rankId,
      scoringIndices,
      pipSum,
      counts,
      uniqueCount: uniqueSorted.length,
      bestRunLen: bestRun.length
    };
  }

        if (sixes > 0) { dChips = sixes * 25; dMult = sixes * 2; label = '+' + dChips + ',+' + dMult + 'M'; }
        break;
      }
      case 'pixie_thistle': {
        const ones = evalRes.counts[1];
        if (ones > 0) { dChips = ones * 15; dMult = ones * 3; label = '+' + dChips + ',+' + dMult + 'M'; }
        break;
      }
      case 'fools_cap':
        if (evalRes.rankId === 'high_pip' || evalRes.rankId === 'pair') { mMult = 2; label = 'X2M'; }
        break;
      case 'honeycomb':
        if (evalRes.counts[3] >= 2) { dChips = 25; label = '+25'; }
        break;
      case 'cobblers_awl':
        if (evalRes.rankId === 'two_pair') { dChips = 40; dMult = 4; label = '+40,+4M'; }
        break;
      case 'bark_rune':
        if ((charmObj.bonusMult || 0) > 0) { dMult = charmObj.bonusMult; label = '+' + dMult + 'M'; }
        break;
      case 'pewter_tankard':
        if (state.handsPlayedThisNight === 0) { dChips = 30; label = '+30'; }
        break;
      case 'fox_tail':
        if (evenCount === 5 || oddCount === 5) { mMult = 2; label = 'X2M'; }
        break;
      case 'scribes_quill':
        dMult = 3; label = '+3M';
        break;
      case 'hearth_kettle':
        if (evalRes.uniqueCount <= 3) { dMult = 6; label = '+6M'; }
        break;
      case 'moonstone_ring':
        if (diceSum <= 14 || diceSum >= 24) { mMult = 2; label = 'X2M'; }
        break;
      case 'chanterelle': {
        const commons = state.charms.filter((ch) => CHARM_MAP[ch.id].rarity === 'common').length;
        if (commons > 0) { dChips = commons * 12; label = '+' + dChips; }
        break;
      }
      case 'goblin_ledger':
        dChips = 12; label = '+12';
        break;
      case 'watchmaker_gear':
        break;
      case 'tavern_deed':
        dChips = 20; label = '+20';
        break;
      case 'cinnamon_stick':
        if (evalRes.counts[1] === 0 && evalRes.counts[6] === 0) { dMult = 5; label = '+5M'; }
        break;
      case 'toadstool_ring':
        if (state.charms.length >= 4) { mMult = 2; label = 'X2M'; }
        break;
      case 'iron_anvil':
        if (!isPreview && (evalRes.rankId === 'four_kind' || evalRes.rankId === 'full_house')) {
          charmObj.bonusChips = (charmObj.bonusChips || 0) + 8;
        }
        if ((charmObj.bonusChips || 0) > 0) { dChips = charmObj.bonusChips; label = '+' + dChips; }
        break;
      case 'crystal_decanter':
        if (state.rollsLeft === 0) { mMult = 2; label = 'X2M'; }
        break;
      case 'starlight_die': {
        const targetFace = ((state.night - 1) % 6) + 1;
        const hits = evalRes.counts[targetFace];
        if (hits > 0) { dChips = hits * 15; dMult = hits * 2; label = '+' + dChips + ',+' + dMult + 'M'; }
        break;
      }
      case 'golden_four_leaf':
        if (evalRes.rankId === 'five_clovers') { mMult = 3; label = 'X3M'; }
        else if (evalRes.rankId === 'full_house' || evalRes.rankId === 'four_kind') { mMult = 2; label = 'X2M'; }
        else { dMult = 6; label = '+6M'; }
        break;
    }

    return { dChips, dMult, mMult, dGold, label };
  }

  function simulateScore(state, isPreview) {
    const evalRes = evaluateHand(state.dice);
    const pouch = POUCHES.find((p) => p.id === state.pouchId);
    const pouchChips = pouch ? pouch.bonusChips : 0;
    let chips = evalRes.rank.baseChips + evalRes.pipSum + pouchChips;
    let mult = evalRes.rank.baseMult;
    const steps = [];
    const rng = state.rng;

    // Locate first non-watchmaker charm for Watchmaker's Gear retrigger
    const firstRetargetIdx = state.charms.findIndex((c) => c.id !== 'watchmaker_gear');

    for (let i = 0; i < state.charms.length; i++) {
      const ch = state.charms[i];
      if (ch.id === 'watchmaker_gear') {
        if (firstRetargetIdx >= 0) {
          const targetCharm = state.charms[firstRetargetIdx];
          const res = applySingleCharm(targetCharm, {
            dice: state.dice, held: state.held, evalRes, state, chips, mult, isPreview
          }, rng);
          if (res.dChips || res.dMult || res.mMult !== 1 || res.dGold) {
            chips += res.dChips;
            mult = (mult + res.dMult) * res.mMult;
            steps.push({ slotIdx: i, charm: ch, label: 'RE:' + res.label, dChips: res.dChips, dMult: res.dMult, mMult: res.mMult, dGold: res.dGold });
          }
        }
        continue;
      }
      const res = applySingleCharm(ch, {
        dice: state.dice, held: state.held, evalRes, state, chips, mult, isPreview
      }, rng);
      if (res.dChips || res.dMult || res.mMult !== 1 || res.dGold || res.label) {
        chips += res.dChips;
        mult = (mult + res.dMult) * res.mMult;
        steps.push({ slotIdx: i, charm: ch, label: res.label, dChips: res.dChips, dMult: res.dMult, mMult: res.mMult, dGold: res.dGold });
      }
    }

    const total = Math.round(chips * mult);
    return { evalRes, baseChips: evalRes.rank.baseChips + evalRes.pipSum + pouchChips, baseMult: evalRes.rank.baseMult, chips, mult, total, steps };
  }

  // Expose core logic for headless Node verification when running outside DOM
  if (typeof globalThis !== 'undefined') {
    globalThis.__PIP_ENGINE__ = {
      evaluateHand,
      applySingleCharm,
      simulateScore,
      CHARMS: ALL_CHARMS,
      HAND_RANKS,
      POUCHES,
      FULL_EDITION
    };
  }

  // ==========================================================================

  const AudioSys = {
    ctx: null,
    muted: false,
    musicPlaying: false,
    musicTimer: null,
    stepIdx: 0,
    ensure() {
      if (this.muted) return null;
      if (!this.ctx && typeof window !== 'undefined') {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      return this.ctx;
    },
    tone(freq, dur, type = 'triangle', vol = 0.12, delay = 0, endFreq = null) {
      const ctx = this.ensure();
      if (!ctx) return;
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
      gain.gain.setValueAtTime(0.001, t0);
      gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    },
    clack(delay = 0, pitch = 1) {
      const ctx = this.ensure();
      if (!ctx) return;
      // Hollow wooden cup clack
      this.tone(240 * pitch, 0.055, 'triangle', 0.13, delay, 105 * pitch);
      this.tone(420 * pitch, 0.035, 'sine', 0.07, delay, 190 * pitch);
    },
    rollDice() {
      for (let i = 0; i < 5; i++) {
        this.clack(i * 0.055, 0.85 + (i % 3) * 0.15);
      }
    },
    lock(isLock) {
      if (isLock) this.tone(680, 0.05, 'triangle', 0.11, 0, 880);
      else this.tone(520, 0.05, 'triangle', 0.09, 0, 380);
    },
    chime(idx) {
      const scale = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5, 1174.66, 1318.51];
      const f = scale[Math.min(scale.length - 1, idx)];
      this.tone(f, 0.22, 'triangle', 0.14, 0);
      this.tone(f * 2, 0.14, 'sine', 0.05, 0.02);
    },
    slam() {
      this.tone(261.63, 0.25, 'triangle', 0.11, 0);
      this.tone(329.63, 0.25, 'triangle', 0.09, 0.03);
      this.tone(392.0, 0.28, 'triangle', 0.1, 0.06);
    },
    coin() {
      this.tone(1318.5, 0.07, 'sine', 0.1, 0);
      this.tone(1760.0, 0.14, 'sine', 0.11, 0.055);
    },
    fanfare() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, 0.28, 'triangle', 0.11, i * 0.09));
    },
    softFail() {
      [349.23, 329.63, 293.66, 220.0].forEach((f, i) => this.tone(f, 0.28, 'triangle', 0.1, i * 0.11));
    },
    startMusic() {
      if (this.musicPlaying || this.muted) return;
      this.musicPlaying = true;
      const melody = [
        293.66, 349.23, 440.0, 523.25, 440.0, 392.0, 349.23, 329.63,
        293.66, 329.63, 392.0, 440.0, 392.0, 349.23, 329.63, 293.66
      ];
      const bass = [146.83, 0, 146.83, 0, 130.81, 0, 130.81, 0, 110.0, 0, 110.0, 0, 130.81, 0, 146.83, 0];
      this.musicTimer = setInterval(() => {
        if (this.muted || !this.ctx) return;
        const i = this.stepIdx % melody.length;
        this.tone(melody[i], 0.24, 'triangle', 0.032, 0);
        if (bass[i] > 0) this.tone(bass[i], 0.28, 'sine', 0.025, 0);
        this.stepIdx++;
      }, 300);
    },
    toggleMute() {
      this.muted = !this.muted;
      if (this.muted && this.musicTimer) {
        clearInterval(this.musicTimer);
        this.musicTimer = null;
        this.musicPlaying = false;
      } else if (!this.muted) {
        this.ensure();
        this.startMusic();
      }
    }
  };

  // ==========================================================================
  // CANVAS & PIXEL DRAWING HELPERS
  // ==========================================================================
  const canvas = document.getElementById('game');
  if (!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  function pxRect(x, y, w, h, col) {
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  }

  function drawWoodBox(x, y, w, h, fill = PAL.woodMid, rim = PAL.woodLight, hi = PAL.woodHi) {
    pxRect(x, y, w, h, PAL.ink);
    pxRect(x + 1, y + 1, w - 2, h - 2, fill);
    pxRect(x + 1, y + 1, w - 2, 1, hi);
    pxRect(x + 1, y + 1, 1, h - 2, rim);
    pxRect(x + 1, y + h - 2, w - 2, 1, PAL.woodDeep);
    pxRect(x + w - 2, y + 1, 1, h - 2, PAL.woodDeep);
  }

  function drawFeltMat(x, y, w, h) {
    drawWoodBox(x, y, w, h, PAL.woodMid, PAL.woodLight, PAL.woodHi);
    const fx = x + 4;
    const fy = y + 4;
    const fw = w - 8;
    const fh = h - 8;
    pxRect(fx - 1, fy - 1, fw + 2, fh + 2, PAL.ink);
    pxRect(fx, fy, fw, fh, PAL.feltDark);
    ctx.fillStyle = PAL.feltLight;
    for (let py = fy; py < fy + fh; py++) {
      for (let px = fx + ((py % 2) ? 1 : 0); px < fx + fw; px += 2) {
        ctx.fillRect(px, py, 1, 1);
      }
    }
    pxRect(fx, fy, fw, 2, PAL.feltShadow);
    pxRect(fx, fy, 2, fh, PAL.feltShadow);
    pxRect(x + 2, y + 2, 1, 1, PAL.gold);
    pxRect(x + w - 3, y + 2, 1, 1, PAL.gold);
    pxRect(x + 2, y + h - 3, 1, 1, PAL.gold);
    pxRect(x + w - 3, y + h - 3, 1, 1, PAL.gold);
  }

  function drawMatrix(x, y, rows, scale = 1) {
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r];
      for (let c = 0; c < row.length; c++) {
        const ch = row[c];
        if (!ch || ch === '.') continue;
        const col = CMAP[ch];
        if (!col) continue;
        pxRect(x + c * scale, y + r * scale, scale, scale, col);
      }
    }
  }

  function drawText5(x, y, text, fg, outline = PAL.ink, scale = 1) {
    const s = String(text || '').toUpperCase();
    const plot = (ox, oy, col) => {
      let cx = ox;
      for (let i = 0; i < s.length; i++) {
        const g = FONT_5X7[s[i]] || FONT_5X7[' '];
        for (let r = 0; r < 7; r++) {
          for (let c = 0; c < 5; c++) {
            if (g[r][c] === '1') pxRect(cx + c * scale, oy + r * scale, scale, scale, col);
          }
        }
        cx += 6 * scale;
      }
    };
    if (outline) {
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx || dy) plot(x + dx * scale, y + dy * scale, outline);
        }
      }
    }
    plot(x, y, fg);
  }

  function drawTiny(x, y, text, fg, outline = null) {
    const s = String(text || '').toUpperCase();
    const plot = (ox, oy, col) => {
      let cx = ox;
      for (let i = 0; i < s.length; i++) {
        const g = FONT_3X5[s[i]] || FONT_3X5[' '];
        const gw = g[0].length;
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < gw; c++) {
            if (g[r][c] === '1') pxRect(cx + c, oy + r, 1, 1, col);
          }
        }
        cx += gw + 1;
      }
    };
    if (outline) {
      plot(x - 1, y, outline);
      plot(x + 1, y, outline);
      plot(x, y - 1, outline);
      plot(x, y + 1, outline);
    }
    plot(x, y, fg);
  }

  function tinyW(t) {
    if (!t) return 0;
    const s = String(t).toUpperCase();
    let w = 0;
    for (let i = 0; i < s.length; i++) {
      const g = FONT_3X5[s[i]] || FONT_3X5[' '];
      w += g[0].length + 1;
    }
    return Math.max(0, w - 1);
  }
  function shortCharmTitle(name) {
    if (!name) return '';
    if (name.length <= 10) return name;
    const words = name.split(' ');
    const last = words[words.length - 1];
    if (last.length >= 4 && last.length <= 10) return last;
    return name.slice(0, 10);
  }
  function text5W(t, scale = 1) { return t ? t.length * 6 * scale - scale : 0; }

  function drawDie(x, y, val, held, scoringHighlight, size = 24) {
    pxRect(x + 2, y + 2, size, size, PAL.feltShadow);
    if (held) pxRect(x - 1, y - 1, size + 2, size + 2, PAL.gold);
    else if (scoringHighlight) pxRect(x - 1, y - 1, size + 2, size + 2, PAL.cloverHi);

    pxRect(x, y, size, size, PAL.ink);
    // Corner carve
    pxRect(x, y, 1, 1, PAL.feltDark);
    pxRect(x + size - 1, y, 1, 1, PAL.feltDark);
    pxRect(x, y + size - 1, 1, 1, PAL.feltDark);
    pxRect(x + size - 1, y + size - 1, 1, 1, PAL.feltDark);

    pxRect(x + 1, y + 1, size - 2, size - 2, PAL.ivory);
    pxRect(x + 1, y + 1, size - 2, 2, PAL.ivoryHi);
    pxRect(x + 1, y + 1, 2, size - 2, PAL.ivoryHi);
    pxRect(x + 2, y + size - 3, size - 3, 2, PAL.ivoryShade);
    pxRect(x + size - 3, y + 2, 2, size - 3, PAL.ivoryShade);

    const pipSize = size >= 22 ? 3 : 2;
    const offA = Math.floor(size * 0.24);
    const offM = Math.floor((size - pipSize) / 2);
    const offB = size - offA - pipSize;
    const coords = {
      1: [[offM, offM]],
      2: [[offA, offA], [offB, offB]],
      3: [[offA, offA], [offM, offM], [offB, offB]],
      4: [[offA, offA], [offB, offA], [offA, offB], [offB, offB]],
      5: [[offA, offA], [offB, offA], [offM, offM], [offA, offB], [offB, offB]],
      6: [[offA, offA], [offB, offA], [offA, offM], [offB, offM], [offA, offB], [offB, offB]]
    }[val] || [[offM, offM]];

    for (let i = 0; i < coords.length; i++) {
      const [px, py] = coords[i];
      const isRed = val === 1 || (val === 5 && i === 2);
      if (val === 1 && size >= 18) {
        const rs = pipSize + 2;
        const rx = x + Math.floor((size - rs) / 2);
        const ry = y + Math.floor((size - rs) / 2);
        pxRect(rx, ry, rs, rs, PAL.red);
        pxRect(rx, ry, 1, 1, PAL.redHi);
        pxRect(rx + 1, ry + rs - 1, rs - 1, 1, PAL.redDark);
      } else {
        pxRect(x + px, y + py, pipSize, pipSize, isRed ? PAL.red : PAL.ink);
        if (isRed) pxRect(x + px, y + py, 1, 1, PAL.redHi);
      }
    }
  }

    G.rng = makeRng(hashSeedStr(G.seedStr));

    G.bestHandPts = 0;
    G.bestHandName = 'NONE';
    G.totalScoreRun = 0;
    G.handsWonRun = 0;
    G.charms = [];
    G.selectedShelfIdx = -1;
    if (FULL_EDITION) {
      const pouch = POUCHES[G.pouchIdx];
      G.pouchId = pouch.id;
      G.gold = pouch.startGold;
      pouch.startCharms.forEach((cid) => G.charms.push({ id: cid }));
    } else {
      G.pouchId = 'standard';
      G.gold = 4;
    }
    if (seedBar) seedBar.classList.remove('visible');
    startNight(1);
  }

  function rollShopOffers() {
    const ownedIds = new Set(G.charms.map((c) => c.id));
    let candidates = CHARM_POOL.filter((c) => !ownedIds.has(c.id));
    if (candidates.length < 3) candidates = [...CHARM_POOL];
    const picks = [];
    const pool = [...candidates];
    while (picks.length < 3 && pool.length > 0) {
      const idx = Math.floor(G.rng() * pool.length);
      picks.push(pool.splice(idx, 1)[0]);
    }
    G.shopOffers = picks;
    G.goblinQuote = GOBLIN_QUOTES[Math.floor(G.rng() * GOBLIN_QUOTES.length)];
  }

  function openShop() {
    G.screen = 'SHOP';
    G.selectedShelfIdx = -1;
    rollShopOffers();
    AudioSys.coin();
  }

  function finishNightClear() {
    const baseReward = 4 + Math.floor((G.night - 1) / 3);
    const spareHands = G.handsLeft;
    const hasSpoon = G.charms.some((c) => c.id === 'gilded_spoon');
    const intCap = hasSpoon ? 10 : 5;
    const interest = Math.min(intCap, Math.floor(G.gold / 5));
    const hasDeed = G.charms.some((c) => c.id === 'tavern_deed');
    const deedBonus = hasDeed ? G.charms.length : 0;

    if (spareHands > 0) {
      G.charms.forEach((c) => {
        if (c.id === 'moth_lantern') c.bonusMult = (c.bonusMult || 0) + 2;
      });
    }

    const totalGain = baseReward + spareHands + interest + deedBonus;
    G.gold += totalGain;
    G.payoutSummary = { baseReward, spareHands, interest, deedBonus, totalGain };
    AudioSys.fanfare();
    spawnSparkles(155, 70, 18);

    if (!FULL_EDITION && G.night >= maxNights) {
      G.screen = 'DEMO_COMPLETE';
    } else if (FULL_EDITION && G.night === 12 && !G.endless) {
      G.screen = 'VICTORY';
    } else {
      G.screen = 'NIGHT_CLEAR';
    }
  }

  function beginScoringHand() {
    if (G.screen !== 'PLAYING' || G.rollAnim > 0) return;
    const res = simulateScore(G, false);
    G.handsLeft--;
    G.handsPlayedThisNight++;
    G.handsWonRun++;
    G.screen = 'SCORING';
    AudioSys.slam();
    spawnSparkles(155, 50, 12);

    G.scoreAnim = {
      res,
      phase: 'BASE', // BASE -> CHARMS -> FINAL
      stepIdx: -1,
      timer: 0.55,
      dispChips: res.baseChips,
      dispMult: res.baseMult,
      dispGold: 0,
      banner: res.evalRes.rank.name + ' +' + res.baseChips + ' X ' + res.baseMult + ' = ' + (res.baseChips * res.baseMult),
      activeSlot: -1,
      badgeText: ''
    };
  }

  function updateScoreAnim(dt) {
    const sa = G.scoreAnim;
    if (!sa) return;
    sa.timer -= dt;
    if (sa.timer > 0) return;

    if (sa.phase === 'BASE' || sa.phase === 'CHARMS') {
      sa.stepIdx++;
      if (sa.stepIdx < sa.res.steps.length) {
        sa.phase = 'CHARMS';
        const st = sa.res.steps[sa.stepIdx];
        sa.activeSlot = st.slotIdx;
        sa.badgeText = st.label;
        sa.dispChips += st.dChips;
        sa.dispMult = (sa.dispMult + st.dMult) * st.mMult;
        if (st.dGold > 0) {
          G.gold += st.dGold;
          AudioSys.coin();
        }
        AudioSys.chime(sa.stepIdx);
        spawnSparkles(88 + st.slotIdx * 26, 20, 7);
        sa.banner = CHARM_MAP[st.charm.id].name + ': ' + st.label;
        sa.timer = 0.42;
      } else {
        sa.phase = 'FINAL';
        sa.activeSlot = -1;
        sa.badgeText = '';
        sa.dispChips = sa.res.chips;
        sa.dispMult = sa.res.mult;
        const pts = sa.res.total;
        G.nightScore += pts;
        G.totalScoreRun += pts;
        if (pts > G.bestHandPts) {
          G.bestHandPts = pts;
          G.bestHandName = sa.res.evalRes.rank.name;
        }
        sa.banner = '+' + pts + ' PTS! (' + Math.round(sa.dispChips) + ' X ' + Math.round(sa.dispMult) + ')';
        AudioSys.slam();
        spawnSparkles(36, 54, 14);
        sa.timer = 0.85;
      }
      return;
    }

    if (sa.phase === 'FINAL') {
      G.scoreAnim = null;
      if (G.nightScore >= G.nightTarget) {
        finishNightClear();
      } else if (G.handsLeft > 0) {
        G.screen = 'PLAYING';
        startHand();
      } else {
        AudioSys.softFail();
        G.screen = 'GAME_OVER';
      }
    }
  }

  function sellCharm(idx) {
    if (idx < 0 || idx >= G.charms.length) return;
    const ch = CHARM_MAP[G.charms[idx].id];
    const refund = Math.max(1, Math.floor(ch.cost / 2));
    G.charms.splice(idx, 1);
    G.gold += refund;
    G.selectedShelfIdx = -1;
    AudioSys.coin();
    showToast('SOLD ' + ch.name + ' +' + refund + 'G', 1.4);
  }

  function moveCharm(idx, dir) {
    const ni = idx + dir;
    if (idx < 0 || ni < 0 || ni >= G.charms.length) return;
    const tmp = G.charms[idx];
    G.charms[idx] = G.charms[ni];
    G.charms[ni] = tmp;
    G.selectedShelfIdx = ni;
    AudioSys.lock(true);
  }

  function buyShopCharm(offerIdx) {
    const ch = G.shopOffers[offerIdx];
    if (!ch) return;
    if (G.charms.length >= G.maxSlots) {
      AudioSys.lock(false);
      showToast('SHELF FULL! CLICK A TOP CHARM TO SELL', 1.8);
      return;
    }
    if (G.gold < ch.cost) {
      AudioSys.lock(false);
      showToast('NEED ' + ch.cost + 'G TO BUY!', 1.3);
      return;
    }
    G.gold -= ch.cost;
    G.charms.push({ id: ch.id });
    G.shopOffers[offerIdx] = null;
    if (G.charms.some((c) => c.id === 'goblin_ledger')) {
      G.gold += 2;
      showToast('BOUGHT + GOBLIN LEDGER +2G!', 1.5);
    } else {
      showToast('BOUGHT ' + ch.name + '!', 1.3);
    }
    AudioSys.coin();
    spawnSparkles(102 + offerIdx * 52, 80, 10);
  }

  function restockCost() {
    return G.charms.some((c) => c.id === 'scribes_quill') ? 1 : 2;
  }

    drawText5(107, 117, 'VISIT PEDDLER >', PAL.goldHi, PAL.ink, 1);
    regBtn(74, 109, 163, 23, openShop);
  }

  function drawShopScreen() {
    drawHudShell();
    drawWoodBox(74, 29, 163, 77, PAL.woodMid, PAL.woodLight, PAL.woodHi);

    // Goblin Portrait
    pxRect(78, 33, 28, 26, PAL.ink);
    pxRect(79, 34, 26, 24, PAL.feltShadow);
    drawMatrix(80, 35, GOBLIN_SPRITE, 1);

    // Speech & Hover Inspect Box
    pxRect(108, 33, 125, 26, PAL.ink);
    pxRect(109, 34, 123, 24, PAL.woodDeep);
    if (G.selectedShelfIdx >= 0 && G.charms[G.selectedShelfIdx]) {
      const sc = CHARM_MAP[G.charms[G.selectedShelfIdx].id];
      drawTiny(113, 37, sc.name, PAL.goldHi);
      drawTiny(113, 45, sc.desc.slice(0, 29), PAL.ivory);
      drawTiny(113, 52, 'CLICK SELL BELOW TO CLEAR SLOT', PAL.redHi);
    } else if (G.hoverShopIdx >= 0 && G.shopOffers[G.hoverShopIdx]) {
      const hc = G.shopOffers[G.hoverShopIdx];
      drawTiny(113, 37, hc.name + ' (' + hc.cost + 'G)', PAL.goldHi);
      drawTiny(113, 45, hc.desc.slice(0, 29), PAL.ivory);
      drawTiny(113, 52, hc.desc.slice(29, 58) || ('RARITY: ' + hc.rarity), PAL.cloverHi);
    } else {
      drawTiny(113, 37, 'GOBLIN PEDDLER', PAL.goblinHi);
      drawTiny(113, 45, '"' + G.goblinQuote.slice(0, 27) + '"', PAL.ivory);
      drawTiny(113, 52, 'HOVER OR CLICK CHARMS TO BUY', PAL.goldHi);
    }

    // 3 Charm Trays
    for (let i = 0; i < 3; i++) {
      const ch = G.shopOffers[i];
      const cx = 78 + i * 52;
      const cy = 62;
      if (ch) {
        drawWoodBox(cx, cy, 49, 41, PAL.woodDeep, PAL.woodLight, PAL.woodHi);
        drawCharmSlot(cx + 14, cy + 3, { id: ch.id }, G.hoverShopIdx === i, false, 20, 19);
        const sname = shortCharmTitle(ch.name);
        drawTiny(cx + Math.floor((49 - tinyW(sname)) / 2), cy + 24, sname, PAL.ivoryHi);
        const canBuy = G.gold >= ch.cost && G.charms.length < G.maxSlots;
        pxRect(cx + 12, cy + 30, 25, 9, PAL.ink);
        pxRect(cx + 13, cy + 31, 23, 7, canBuy ? PAL.goldDark : PAL.woodMid);
        drawTiny(cx + 18, cy + 32, ch.cost + 'G', canBuy ? PAL.goldHi : PAL.ivoryEdge);
        regBtn(cx, cy, 49, 41, () => buyShopCharm(i));
      } else {
        pxRect(cx, cy, 49, 41, PAL.ink);
        pxRect(cx + 1, cy + 1, 47, 39, PAL.woodDeep);
        drawTiny(cx + 16, cy + 19, 'SOLD', PAL.ivoryEdge);
      }
    }

    // Bottom Shop Controls (or Sell Shelf Bar)
    if (G.selectedShelfIdx >= 0 && G.charms[G.selectedShelfIdx]) {
      const selCh = CHARM_MAP[G.charms[G.selectedShelfIdx].id];
      const sellAmt = Math.max(1, Math.floor(selCh.cost / 2));
      drawWoodBox(74, 109, 30, 23, PAL.woodMid, PAL.woodLight, PAL.woodHi);
      drawText5(86, 117, '<', PAL.goldHi, PAL.ink, 1);
      regBtn(74, 109, 30, 23, () => moveCharm(G.selectedShelfIdx, -1));

      drawWoodBox(106, 109, 30, 23, PAL.woodMid, PAL.woodLight, PAL.woodHi);
      drawText5(118, 117, '>', PAL.goldHi, PAL.ink, 1);
      regBtn(106, 109, 30, 23, () => moveCharm(G.selectedShelfIdx, 1));

      drawWoodBox(139, 109, 64, 23, PAL.red, PAL.redHi, PAL.goldHi);
      drawText5(146, 117, 'SELL +' + sellAmt + 'G', PAL.goldHi, PAL.ink, 1);
      regBtn(139, 109, 64, 23, () => sellCharm(G.selectedShelfIdx));

      drawWoodBox(206, 109, 31, 23, PAL.slate, PAL.slateHi, PAL.ivoryHi);
      drawTiny(211, 118, 'DONE', PAL.ivoryHi);
      regBtn(206, 109, 31, 23, () => { G.selectedShelfIdx = -1; });
    } else {
      const rc = restockCost();
      const canRestock = G.gold >= rc;
      drawWoodBox(74, 109, 74, 23, canRestock ? PAL.slate : PAL.woodDeep, PAL.slateHi, PAL.ivoryHi);
      drawText5(80, 117, 'RESTOCK ' + rc + 'G', canRestock ? PAL.ivoryHi : PAL.ivoryEdge, PAL.ink, 1);
      if (canRestock) {
        regBtn(74, 109, 74, 23, () => {
          G.gold -= rc;
          rollShopOffers();
          AudioSys.coin();
        });
      }

      drawWoodBox(151, 109, 86, 23, PAL.green, PAL.greenHi, PAL.cloverHi);
      drawText5(161, 117, 'NEXT NIGHT>', PAL.goldHi, PAL.ink, 1);
      regBtn(151, 109, 86, 23, () => startNight(G.night + 1));
    }
  }

  function drawEndScreens() {
    drawHudShell();
    drawFeltMat(74, 29, 163, 77);

    if (G.screen === 'DEMO_COMPLETE') {
      drawText5(92, 37, 'DEMO CLEARED!', PAL.goldHi, PAL.ink, 1);
      pxRect(82, 49, 147, 50, PAL.ink);
      pxRect(83, 50, 145, 48, PAL.feltShadow);
      drawTiny(88, 55, 'YOU BEAT ALL 4 TAVERN NIGHTS!', PAL.cloverHi);
      drawTiny(88, 63, 'BEST HAND: ' + G.bestHandName, PAL.ivory);
      drawTiny(88, 70, 'TOP SCORE: ' + G.bestHandPts + ' PTS', PAL.goldHi);
      drawTiny(88, 79, 'FULL GAME (3.49 GBP) ON ITCH:', PAL.ivory);
      drawTiny(88, 86, '12 NIGHTS+ENDLESS, 45 CHARMS, 4 POUCHES', PAL.goldHi);

      drawWoodBox(74, 109, 86, 23, PAL.goldDark, PAL.gold, PAL.goldHi);
      drawText5(82, 117, 'GET FULL GAME', PAL.ivoryHi, PAL.ink, 1);
      regBtn(74, 109, 86, 23, () => {
        if (typeof window !== 'undefined') window.open(ITCH_URL, '_blank', 'noopener');
      });

      drawWoodBox(163, 109, 74, 23, PAL.green, PAL.greenHi, PAL.cloverHi);
      drawText5(171, 117, 'PLAY AGAIN', PAL.goldHi, PAL.ink, 1);
      regBtn(163, 109, 74, 23, startNewRun);
    } else if (G.screen === 'VICTORY') {
      drawText5(87, 37, 'TAVERN CHAMPION!', PAL.goldHi, PAL.ink, 1);
      pxRect(82, 49, 147, 50, PAL.ink);
      pxRect(83, 50, 145, 48, PAL.woodDeep);
      drawTiny(88, 56, 'ALL 12 NIGHTS CONQUERED!', PAL.cloverHi);
      drawTiny(88, 65, 'TOTAL SCORE: ' + G.totalScoreRun, PAL.ivory);
      drawTiny(88, 74, 'BEST HAND: ' + G.bestHandPts + ' (' + G.bestHandName + ')', PAL.goldHi);
      drawTiny(88, 84, 'READY FOR HIGH-STAKES ENDLESS?', PAL.ivory);

      drawWoodBox(74, 109, 88, 23, PAL.red, PAL.redHi, PAL.goldHi);
      drawText5(79, 117, 'ENDLESS MODE', PAL.goldHi, PAL.ink, 1);
      regBtn(74, 109, 88, 23, () => { G.endless = true; openShop(); });

      drawWoodBox(165, 109, 72, 23, PAL.green, PAL.greenHi, PAL.cloverHi);
      drawText5(179, 117, 'NEW RUN', PAL.ivoryHi, PAL.ink, 1);
      regBtn(165, 109, 72, 23, startNewRun);
    } else {
      drawText5(98, 37, 'OUT OF HANDS!', PAL.redHi, PAL.ink, 1);
      pxRect(82, 49, 147, 50, PAL.ink);
      pxRect(83, 50, 145, 48, PAL.woodDeep);
      drawTiny(88, 56, 'REACHED NIGHT ' + G.night, PAL.ivory);
      drawTiny(88, 65, 'NIGHT SCORE: ' + G.nightScore + ' / ' + G.nightTarget, PAL.gold);
      drawTiny(88, 74, 'BEST HAND: ' + G.bestHandPts + ' PTS', PAL.cloverHi);
      drawTiny(88, 84, 'SEED: ' + G.seedStr, PAL.ivoryShade);

      drawWoodBox(74, 109, 82, 23, PAL.green, PAL.greenHi, PAL.cloverHi);
      drawText5(85, 117, 'TRY AGAIN', PAL.goldHi, PAL.ink, 1);
      regBtn(74, 109, 82, 23, startNewRun);

      drawWoodBox(159, 109, 78, 23, PAL.woodMid, PAL.woodLight, PAL.woodHi);
      drawText5(180, 117, 'TITLE', PAL.ivoryHi, PAL.ink, 1);
      regBtn(159, 109, 78, 23, () => {
        G.screen = 'TITLE';
        if (FULL_EDITION && seedBar) seedBar.classList.add('visible');
      });
    }
  }

  function drawModalOverlay() {
    if (!G.modal) return;
    pxRect(12, 10, 216, 115, PAL.ink);
    drawWoodBox(13, 11, 214, 113, PAL.woodDeep, PAL.woodMid, PAL.woodLight);

    // Tabs
    drawWoodBox(18, 15, 66, 14, G.modal === 'HANDS' ? PAL.feltDark : PAL.woodMid, PAL.woodLight, PAL.gold);
    drawTiny(28, 20, 'HAND RANKS', PAL.goldHi);
    regBtn(18, 15, 66, 14, () => { G.modal = 'HANDS'; });

    drawWoodBox(87, 15, 68, 14, G.modal === 'CODEX' ? PAL.feltDark : PAL.woodMid, PAL.woodLight, PAL.gold);
    drawTiny(95, 20, 'CHARMS (' + CHARM_POOL.length + ')', PAL.goldHi);
    regBtn(87, 15, 68, 14, () => { G.modal = 'CODEX'; G.codexPage = 0; });

    drawWoodBox(194, 15, 28, 14, PAL.red, PAL.redHi, PAL.goldHi);
    drawTiny(202, 20, 'X', PAL.ivoryHi);
    regBtn(194, 15, 28, 14, () => { G.modal = null; });

    if (G.modal === 'HANDS') {
      drawTiny(20, 34, 'HAND             BASE        RULE', PAL.ivoryShade);
      for (let i = 0; i < HAND_RANKS.length; i++) {
        const h = HAND_RANKS[i];
        const y = 43 + i * 9;
        drawTiny(20, y, h.name.slice(0, 15), PAL.goldHi);
        drawTiny(86, y, '+' + h.baseChips + ' X ' + h.baseMult, PAL.cloverHi);
        drawTiny(134, y, h.desc.slice(0, 22), PAL.ivory);
      }
    } else {
      const perPage = 4;
      const totalPages = Math.ceil(CHARM_POOL.length / perPage);
      const start = G.codexPage * perPage;
      for (let i = 0; i < perPage; i++) {
        const ch = CHARM_POOL[start + i];
        if (!ch) break;
        const y = 34 + i * 20;
        drawCharmSlot(20, y, { id: ch.id }, false, false, 18, 18);
        drawTiny(42, y + 2, ch.name + ' (' + ch.cost + 'G)', PAL.goldHi);
        drawTiny(42, y + 10, ch.desc.slice(0, 44), PAL.ivory);
      }
      drawWoodBox(20, 108, 42, 12, PAL.woodMid, PAL.woodLight, PAL.woodHi);
      drawTiny(31, 112, '< PREV', PAL.ivoryHi);
      regBtn(20, 108, 42, 12, () => {
        G.codexPage = (G.codexPage + totalPages - 1) % totalPages;
      });
      drawTiny(98, 112, 'PAGE ' + (G.codexPage + 1) + '/' + totalPages, PAL.goldHi);
      drawWoodBox(178, 108, 42, 12, PAL.woodMid, PAL.woodLight, PAL.woodHi);
      drawTiny(189, 112, 'NEXT >', PAL.ivoryHi);
      regBtn(178, 108, 42, 12, () => {
        G.codexPage = (G.codexPage + 1) % totalPages;
      });
    }
  }

  function render() {
    G.buttons = [];
    pxRect(0, 0, 240, 135, PAL.woodDeep);

    if (G.screen === 'TITLE') drawTitleScreen();
    else if (G.screen === 'PLAYING' || G.screen === 'SCORING') drawPlayingAndScoring();
    else if (G.screen === 'NIGHT_CLEAR') drawNightClearOverlay();
    else if (G.screen === 'SHOP') drawShopScreen();
    else drawEndScreens();

    // Render particles
    for (let i = 0; i < G.sparkles.length; i++) {
      const sp = G.sparkles[i];
      pxRect(sp.x, sp.y, 1, 1, sp.col);
      if (sp.life > 0.22) {
        pxRect(sp.x - 1, sp.y, 1, 1, PAL.gold);
        pxRect(sp.x + 1, sp.y, 1, 1, PAL.gold);
      }
    }

    if (G.modal) {
      G.buttons = []; // Modal captures input
      drawModalOverlay();
    }
  }

  // ==========================================================================
  // INPUT & FRAME LOOP
  // ==========================================================================
  function toLogicalCoords(ev) {
    const r = canvas.getBoundingClientRect();
    const lx = Math.floor(((ev.clientX - r.left) / r.width) * 240);
    const ly = Math.floor(((ev.clientY - r.top) / r.height) * 135);
    return { x: lx, y: ly };
  }

  canvas.addEventListener('pointermove', (ev) => {
    const p = toLogicalCoords(ev);
    G.mouseX = p.x;
    G.mouseY = p.y;
    G.hoverShelfIdx = -1;
    G.hoverShopIdx = -1;
    if (p.y >= 4 && p.y <= 25) {
      for (let i = 0; i < G.charms.length; i++) {
        const sx = 77 + i * 26;
        if (p.x >= sx && p.x <= sx + 22) G.hoverShelfIdx = i;
      }
    }
    if (G.screen === 'SHOP' && p.y >= 62 && p.y <= 103) {
      for (let i = 0; i < 3; i++) {
        const cx = 78 + i * 52;
        if (p.x >= cx && p.x <= cx + 49) G.hoverShopIdx = i;
      }
    }
  });

  canvas.addEventListener('pointerdown', (ev) => {
    AudioSys.ensure();
    const p = toLogicalCoords(ev);
    for (let i = G.buttons.length - 1; i >= 0; i--) {
      const b = G.buttons[i];
      if (p.x >= b.x && p.x < b.x + b.w && p.y >= b.y && p.y < b.y + b.h) {
        b.fn();
        render();
        return;
      }
    }
  });

  if (typeof window !== 'undefined') {
    if (FULL_EDITION && seedBar) seedBar.classList.add('visible');
    if (seedOkBtn && seedBox) {
      seedOkBtn.addEventListener('click', () => {
        const clean = seedBox.value.trim().toUpperCase().replace(/[^A-Z0-9-]/g, '');
        G.seedStr = clean || 'CLOVER7';
        seedBox.value = G.seedStr;
        AudioSys.lock(true);
      });
    }

    window.addEventListener('keydown', (ev) => {
      if (document.activeElement === seedBox) return;
      const k = ev.key.toLowerCase();
      if (k === 'm') { AudioSys.toggleMute(); return; }
      if (k === '?' || k === 'h') {
        G.modal = G.modal === 'HANDS' ? null : 'HANDS';
        return;
      }
      if (k === 'escape' && G.modal) { G.modal = null; return; }
      if (G.modal) return;

      if (G.screen === 'TITLE') {
        if (k === ' ' || k === 'enter') { ev.preventDefault(); startNewRun(); }
        if (FULL_EDITION && k === 'arrowleft') G.pouchIdx = (G.pouchIdx + POUCHES.length - 1) % POUCHES.length;
        if (FULL_EDITION && k === 'arrowright') G.pouchIdx = (G.pouchIdx + 1) % POUCHES.length;
        return;
      }

      if (G.screen === 'PLAYING' && G.rollAnim <= 0) {
        if (k >= '1' && k <= '5') {
          const idx = parseInt(k, 10) - 1;
          G.held[idx] = !G.held[idx];
          AudioSys.lock(G.held[idx]);
        } else if (k === ' ' || k === 'r') {
          ev.preventDefault();
          if (G.rollsLeft > 0) rollDiceInternal(false);
        } else if (k === 'enter' || k === 's') {
          ev.preventDefault();
          beginScoringHand();
        }
      } else if (G.screen === 'NIGHT_CLEAR' && (k === ' ' || k === 'enter')) {
        ev.preventDefault();
        openShop();
      } else if (G.screen === 'SHOP' && (k === ' ' || k === 'enter')) {
        ev.preventDefault();
        startNight(G.night + 1);
      }
    });

    let lastTs = performance.now();
    function tick(now) {
      const dt = Math.min(0.05, (now - lastTs) / 1000);
      lastTs = now;
      if (G.rollAnim > 0) G.rollAnim = Math.max(0, G.rollAnim - dt);
      if (G.statusTimer > 0) G.statusTimer = Math.max(0, G.statusTimer - dt);
      for (let i = G.sparkles.length - 1; i >= 0; i--) {
        const sp = G.sparkles[i];
        sp.x += sp.vx * dt;
        sp.y += sp.vy * dt;
        sp.vy += 28 * dt;
        sp.life -= dt;
        if (sp.life <= 0) G.sparkles.splice(i, 1);
      }
      if (G.screen === 'SCORING') updateScoreAnim(dt);
      render();
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }
})();
</script>
